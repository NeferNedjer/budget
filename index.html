<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Bugdet</title>
</head>
<body>
    <h1>Gestion de budget</h1>

        <!-- Formulaire pour ajouter une transaction -->

    <form id="addTransactionForm">
        <input type="number" id="amount" placeholder="Montant" required>
        <select id="category_id" required>
            <option value="">--choisir la catégorie--</option>
            <option value="1">Nourriture</option>
            <option value="2">Loisirs</option>
            <option value="3">Logement</option>
            <option value="4">Facture</option>
            <option value="5">Revenu</option>
            option
        </select>
        <select id="type">
            <option value="">--choisir le type--</option>
            <option value="expense">Dépense</option>
            <option value="income">Revenu</option>
        </select>
        <input type="text" id="description" placeholder="Description">
        <button type="submit">Ajouter</button>
    </form>
    <div id="validation" style="display: none;"></div>
    <div id="containerType">
        
        <div id="depenses">
            <h2>Dépenses :</h2>
            <table id="depensesTable" border="1" cellpadding="10" cellspacing="0">
                <thead>
                    <tr>
                        <th>Montant</th>
                        <th>Catégorie</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="depensesBody"></tbody>
            </table>
        </div>

        <div id="revenus">
            <h2>Revenus :</h2>
            <table id="revenusTable" border="1" cellpadding="10" cellspacing="0">
                <thead>
                    <tr>
                        <th>Montant</th>
                        <th>Catégorie</th>
                        <th>Description</th>
                    </tr>
                </thead>
                <tbody id="revenusBody"></tbody>
            </table>
        </div>
        
    </div>

    <!-- <h2>mon tableau de bord</h2> -->
    <div id="dashboard">
        <div class="card" id="revenus" >Revenus : <span id="totalRevenus">...</span></div>
        <div class="card" id="depenses" >Dépenses : <span id="totalDepenses">...</span></div>
        <div class="card" id="solde">Solde : <span id="totalSolde">...</span></div>
    </div>
    
    <div id="total-depenses"></div>

    <script src="./js/main.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
